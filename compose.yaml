# Laya Playground: the Laravel app plus a local laya-serve with the Laya model.
#
#   docker compose up --build        # then open http://localhost:8080
#
# The first build of laya-serve installs PyTorch (CPU) and takes a few minutes. On first start it
# downloads the English and multilingual checkpoints (about 2 GB) into the laya-models volume and
# loads them; the playground shows "laya-serve offline" until that is done. Later starts are quick.
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      LAYA_URL: http://laya:8000
      LAYA_API_KEY: "${LAYA_API_KEY:-}"
    depends_on:
      - laya
    restart: unless-stopped

  laya:
    # Upstream Laya's own Dockerfile, pinned to the commit laya-php tests against (Laya v0.4.6).
    build:
      context: https://github.com/NandhaKishorM/laya.git#c73908d96ff73c0062c340a11bf7c54ec7d8bc4d
    command: ["laya-serve"]
    ports:
      - "127.0.0.1:${LAYA_PORT:-8000}:8000"
    environment:
      LAYA_DEVICE: cpu
      # Download and load the checkpoints at startup, so the first request in the playground is fast.
      # Set LAYA_PRELOAD=0 to load them lazily on first use instead.
      LAYA_PRELOAD: "${LAYA_PRELOAD:-1}"
      LAYA_MODELS: "${LAYA_MODELS:-english,multilingual}"
      LAYA_API_KEY: "${LAYA_API_KEY:-}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
    volumes:
      - laya-models:/home/laya/.cache/huggingface
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      start_period: 15m
      start_interval: 2s

volumes:
  laya-models:
